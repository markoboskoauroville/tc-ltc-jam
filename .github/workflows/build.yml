name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP '^appVersion=\K\d+' gradle.properties)
          APK="TC-LTC-JAM-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" "$APK" --latest \
            --title "TC LTC JAM v$V" \
            --notes "Standalone 25 fps visual timecode and 48 kHz SMPTE LTC output."
